name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  gdunit4:
    name: gdUnit4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'   # use the plugin committed in addons/gdUnit4
          paths: 'res://tests'
          timeout: 5
          arguments: '-c'        # run every test instead of stopping a suite at its first failure
