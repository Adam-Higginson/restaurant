name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  GODOT_VERSION: '4.7.2-stable'
  GODOT: /home/runner/godot/godot

jobs:
  gdunit4:
    name: gdUnit4
    runs-on: ubuntu-latest
    # A backstop: the test run below stops itself well before this.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # We run Godot ourselves rather than through gdUnit4-action, so that a
      # hang can be made to print where Godot was stuck (see "Run the tests").
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/godot
          package=Godot_v${GODOT_VERSION}_linux.x86_64
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${package}.zip
          unzip -q ${package}.zip -d /home/runner/godot
          mv /home/runner/godot/${package} "$GODOT"
          chmod u+x "$GODOT"

      - name: Import the project
        run: |
          "$GODOT" --version
          "$GODOT" --headless --path . --import

      # The same command gdUnit4-action ran, through gdUnit's own command line tool:
      # --headless: nothing is drawn, like run_tests.sh. Drawn on the CPU-only
      #   runner, every frame of the lit 3D scenes made CI take nearly ten minutes.
      # -c runs every test instead of stopping a suite at its first failure.
      # --fixed-fps 60 runs frames back to back at a fixed 1/60 s each instead
      #   of waiting for the real clock, so the suite finishes in a minute or two.
      # --ignoreHeadlessMode lets gdUnit v6 run scene tests headless.
      #
      # If Godot hasn't finished after 4 minutes it has hung (it has, now and
      # then, after every test passed). Then:
      # 1. gdb attaches and prints every thread's stack, which works even when
      #    Godot is stuck so late in shutting down that its own crash handler
      #    is already off.
      # 2. SIGSEGV makes Godot's crash handler print its own backtrace,
      #    including the GDScript one, if it's still on.
      - name: Run the tests
        run: |
          "$GODOT" --path . -s -d --remote-debug tcp://127.0.0.1:0 \
              res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
              --headless --audio-driver Dummy --add res://tests/hang_probe_test.gd \
              -c --fixed-fps 60 --ignoreHeadlessMode > godot.log 2>&1 &
          pid=$!
          tail -f --pid=$pid godot.log &
          for second in $(seq 240); do
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          if kill -0 $pid 2>/dev/null; then
            echo "::group::Every thread's stack (gdb)"
            sudo apt-get install -y -qq gdb > /dev/null 2>&1
            sudo gdb -batch -p $pid -ex "info threads" -ex "thread apply all bt" 2>&1 | tail -300
            echo "::endgroup::"
            kill -SEGV $pid
            sleep 15
            kill -KILL $pid 2>/dev/null
            wait $pid 2>/dev/null
            sleep 1
            echo "::error::Godot hung and was stopped after 4 minutes. The thread stacks and backtrace above show where it was stuck."
            echo "Run tests ends with 124"
            exit 124
          fi
          wait $pid
          code=$?
          sleep 1
          echo "Run tests ends with $code"
          exit $code

      - name: Publish the test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: test-report.xml
          path: 'reports/**/*.xml'
          reporter: java-junit
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'false'

      - name: Keep the logs when something went wrong
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-log
          path: |
            godot.log
            reports/
