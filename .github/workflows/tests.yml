name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  gdunit4:
    name: gdUnit4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'   # use the plugin committed in addons/gdUnit4
          paths: 'res://tests'
          # Minutes for the whole run. The galley scene suites alone take about
          # two and a quarter on CI, so 5 was too tight once they landed.
          timeout: 10
          # -c runs every test instead of stopping a suite at its first failure.
          # --fixed-fps 60 runs frames back to back at a fixed 1/60 s each instead
          # of waiting for the real clock, so the suite finishes in about a minute.
          arguments: '-c --fixed-fps 60'
